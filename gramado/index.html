<style>
/* Layout: app de bolso, uma coluna de ~640px, cabeçalho curto, barra de abas fixa no rodapé. Tema escuro como padrão. */
:root{
  color-scheme: dark;
  --bg:#14161A; --sup:#1D2026; --sup2:#23272E; --borda:#2C313A;
  --tx:#E8EAED; --tx2:#A0A6B0;
  --verde:#4ADE80; --laranja:#FB923C; --azul:#60A5FA; --lilas:#C4B5FD; --roxo:#A855F7;
  --verde-f:rgba(74,222,128,.12); --laranja-f:rgba(251,146,60,.13); --roxo-f:rgba(168,85,247,.14); --azul-f:rgba(96,165,250,.12); --lilas-f:rgba(196,181,253,.12);
  --f-disp:"Grenze", "Palatino Linotype", Georgia, serif;
  --f-txt:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#F4F5F7; --sup:#FFFFFF; --sup2:#EEF0F3; --borda:#D7DBE1;
    --tx:#16181C; --tx2:#5A616C;
    --verde:#15803D; --laranja:#C2410C; --azul:#1D4ED8; --lilas:#6D28D9; --roxo:#7E22CE;
    --verde-f:rgba(21,128,61,.10); --laranja-f:rgba(194,65,12,.10); --roxo-f:rgba(126,34,206,.10); --azul-f:rgba(29,78,216,.09); --lilas-f:rgba(109,40,217,.08);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#F4F5F7; --sup:#FFFFFF; --sup2:#EEF0F3; --borda:#D7DBE1;
  --tx:#16181C; --tx2:#5A616C;
  --verde:#15803D; --laranja:#C2410C; --azul:#1D4ED8; --lilas:#6D28D9; --roxo:#7E22CE;
  --verde-f:rgba(21,128,61,.10); --laranja-f:rgba(194,65,12,.10); --roxo-f:rgba(126,34,206,.10); --azul-f:rgba(29,78,216,.09); --lilas-f:rgba(109,40,217,.08);
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--tx);font-family:var(--f-txt);font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:2.3rem;letter-spacing:.005em}
h2{font-size:1.7rem}
h3{font-size:1.25rem}
p{margin:0}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2);font-weight:700}
.sec{color:var(--tx2)}
.num{font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header.top .alt{font-size:.82rem;color:var(--tx2);text-align:right}
.aviso{font-size:.88rem;color:var(--tx2);border:1px dashed var(--borda);border-radius:var(--r);padding:10px 12px;margin-bottom:16px}
.aviso.ed{border-style:solid;border-color:var(--roxo);color:var(--tx);background:var(--roxo-f)}

/* abas */
nav.abas{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sup);border-top:1px solid var(--borda);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.abas .in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.abas button{background:none;border:0;padding:11px 2px 12px;font-size:.84rem;color:var(--tx2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.abas button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav.abas button[aria-current="true"]{color:var(--tx);font-weight:700}
nav.abas button[aria-current="true"] svg{stroke:var(--verde)}

/* blocos */
.bloco{display:flex;flex-direction:column;gap:14px}
.card{background:var(--sup);border:1px solid var(--borda);border-radius:var(--r);padding:16px}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grade2{grid-template-columns:1fr}}

/* hoje */
.agora{background:var(--sup);border:1px solid var(--borda);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px}
.agora .hora{font-family:var(--f-disp);font-size:2.6rem;line-height:1;font-weight:600}
.agora .oq{font-size:1.15rem;font-weight:700}
.cont{display:inline-flex;align-items:baseline;gap:6px;font-size:.95rem;color:var(--tx2)}
.cont b{color:var(--verde);font-size:1.1rem}
.contagem{font-family:var(--f-disp);font-size:4.2rem;line-height:.95;font-weight:600;color:var(--laranja)}

/* linha do tempo */
.dia-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.periodo{border-top:1px solid var(--borda);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.periodo:first-of-type{border-top:0;padding-top:0}
.per-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.per-cab .eyebrow{display:flex;gap:8px;align-items:center}
.pill{display:inline-block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--roxo-f);color:var(--roxo)}
.pill.chuva{background:var(--azul-f);color:var(--azul)}
.itens{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.item{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:start;padding:8px 0}
.item .h{font-variant-numeric:tabular-nums;font-weight:700;padding-top:1px}
.item .tp{display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:1px}
.k-comer .tp{color:var(--lilas)} .k-natal .tp{color:var(--laranja)} .k-viagem .tp{color:var(--azul)} .k-passeio .tp{color:var(--verde)} .k-livre .tp{color:var(--tx2)}
.item.feito .t{color:var(--tx2)}
.item.feito .t .nome::after{content:" ✓";color:var(--verde)}
.item.cancelado .t .nome{text-decoration:line-through;color:var(--tx2)}
.item.atual{background:var(--verde-f);border-radius:8px;padding-inline:8px;margin-inline:-8px}
.rest-esc{font-weight:700}
.rest-opc{color:var(--tx2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--borda);background:var(--sup2);border-radius:999px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--lilas);background:var(--lilas-f);color:var(--tx);font-weight:700}
.check{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--borda);background:none;cursor:pointer;display:grid;place-items:center;color:transparent}
.check[aria-pressed="true"]{border-color:var(--verde);background:var(--verde-f);color:var(--verde)}
.det{font-size:.88rem;color:var(--tx2);display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.det dt{font-weight:700;color:var(--tx2)} .det dd{margin:0}
.obs{font-size:.9rem;border-left:2px solid var(--laranja);padding-left:10px}
.nota{font-size:.92rem;background:var(--roxo-f);border-radius:8px;padding:8px 10px}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--borda);background:var(--sup2);border-radius:8px;padding:7px 13px;font-size:.88rem;cursor:pointer}
.btn.pri{background:var(--verde);border-color:var(--verde);color:#0B1A10;font-weight:700}
.btn.alerta{border-color:var(--laranja);color:var(--laranja)}
.btn.peq{padding:4px 10px;font-size:.82rem}
.chuva-box{background:var(--azul-f);border-radius:var(--r);padding:12px 14px;font-size:.92rem;display:flex;flex-direction:column;gap:8px}
.chuva-box b{color:var(--azul)}

/* seletor de dias */
.dias{display:grid;grid-template-columns:repeat(8,minmax(42px,1fr));gap:6px;overflow-x:auto;padding-bottom:4px}
.dias button{border:1px solid var(--borda);background:var(--sup);border-radius:8px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.dias button small{font-size:.68rem;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
.dias button b{font-family:var(--f-disp);font-size:1.35rem;font-weight:600}
.dias button[aria-current="true"]{border-color:var(--verde);background:var(--verde-f)}
.dias button.hoje small{color:var(--verde);font-weight:700}

/* lugares */
.seg{display:inline-flex;border:1px solid var(--borda);border-radius:999px;padding:3px;background:var(--sup)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--tx2)}
.seg button[aria-pressed="true"]{background:var(--sup2);color:var(--tx);font-weight:700}
.lugar{display:flex;flex-direction:column;gap:6px}
.lugar .cab{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lugar .nota-g{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.lugar .usado{font-size:.82rem;color:var(--lilas);font-weight:700}
.tag{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--tx2)}
.tag.ok{color:var(--verde)}

/* gastos */
.metrica{display:flex;flex-direction:column;gap:4px}
.metrica .v{font-family:var(--f-disp);font-size:1.9rem;font-weight:600;line-height:1}
.barra{position:relative;height:10px;border-radius:5px;background:var(--sup2);overflow:hidden}
.barra i{position:absolute;left:0;top:0;bottom:0;background:var(--verde);border-radius:5px}
.barra i.alto{background:var(--laranja)}
.barra s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--tx2)}
.cat{display:flex;flex-direction:column;gap:6px}
.cat .lin{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;flex-wrap:wrap}
form.gasto{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.gasto .full{grid-column:1/-1}
@media (max-width:420px){form.gasto{grid-template-columns:1fr}}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--tx2);font-weight:700}
.inp{background:var(--bg);border:1px solid var(--borda);border-radius:8px;padding:9px 10px;font-size:1rem;width:100%;color:var(--tx);font-weight:400}
.lanc{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--borda)}
.lanc .val{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.lanc .meta{font-size:.82rem;color:var(--tx2)}

/* tabelas */
.tabw{overflow-x:auto;border:1px solid var(--borda);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--borda);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);background:var(--sup2)}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
ul.lista{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.fone{font-variant-numeric:tabular-nums;font-weight:700;user-select:all}

/* diálogo */
dialog{border:1px solid var(--borda);border-radius:14px;background:var(--sup);color:var(--tx);padding:0;width:min(600px,calc(100vw - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
.ed-item{border:1px solid var(--borda);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:90px 1fr;gap:8px}
.ed-item .full{grid-column:1/-1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;z-index:40;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .2s}}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = v => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0);
const dataBR = iso => iso ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4) : "";
const ddmm = iso => iso.slice(8,10)+"/"+iso.slice(5,7);
function minDe(h){ const m = /^(\d{1,2})h(\d{2})?$/.exec((h||"").trim()); return m ? (+m[1])*60 + (+(m[2]||0)) : null; }
function hDe(min){ return String(Math.floor(min/60)).padStart(2,"0")+"h"+String(min%60).padStart(2,"0"); }
function parseValor(s){ s = String(s||"").replace(/[R$\s]/g,""); if (s.includes(",")) s = s.replace(/\./g,"").replace(",","."); const v = parseFloat(s); return isFinite(v) ? Math.round(v*100)/100 : NaN; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function agora(){
  if (S.sim) return S.sim;
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {data:`${p.year}-${p.month}-${p.day}`, min:(+p.hour%24)*60 + (+p.minute)};
}
function diasEntre(a,b){ return Math.round((Date.parse(b+"T00:00:00Z") - Date.parse(a+"T00:00:00Z"))/86400000); }

function tipo(it){
  if (it.rest) return ["comer","Refeição"];
  if (/Nativitaten|Brilho|Acendimento|Parada|Palco/.test(it.t)) return ["natal","Natal Luz"];
  if (/Voo|transfer|Check-in|Chegada a|Conexão|Pouso/.test(it.t)) return ["viagem","Viagem"];
  if (/Tempo livre|Descanso|Sem atividade/.test(it.t)) return ["livre","Livre"];
  return ["passeio","Passeio"];
}
function restTexto(it){
  if (it.outro) return {esc:it.outro};
  if (it.esc && REST[it.esc]) return {esc:REST[it.esc].nome};
  return {opc: it.rest.map(n => REST[n]?.nome).filter(Boolean).join(" ou ")};
}

/* slot efetivo = base + ajuste gravado */
function slotId(d,p){ return d+"-"+p; }
function slot(d, p){
  const dia = DIAS.find(x=>x.id===d), base = dia.slots[p], a = S.aj[slotId(d,p)];
  return {...base, itens: a && Array.isArray(a.itens) ? a.itens : base.itens, nota: a?.nota || "", alterado: !!a, em: a?.em};
}
function itensDoDia(d){
  const out = [];
  for (const p of ["manha","tarde","noite"]){
    let last = PER_MIN[p];
    slot(d,p).itens.forEach((it,i) => {
      const m = minDe(it.h);
      if (m != null) last = m;
      out.push({...it, per:p, i, min:last, slot:slotId(d,p)});
    });
  }
  return out;
}

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 3200); }

/* ===================== GRAVAÇÃO ===================== */
async function gravarSlot(id, itens, nota){
  if (!S.db) return;
  const ord = itens.map((it,k)=>({it,k}));
  let last = -1;
  ord.forEach(o => { const m = minDe(o.it.h); if (m != null) last = m; o.m = last; });
  ord.sort((a,b)=> a.m - b.m || a.k - b.k);
  try { await S.db.doc("ajustes/"+id).set({itens: ord.map(o=>o.it), nota: nota||"", em:new Date().toISOString()}); toast("Programação salva"); }
  catch(e){ toast("Não foi possível salvar: "+(e?.code==="unavailable" ? "sem conexão, tente de novo" : (e?.message||"erro"))); }
}
async function alterarItem(id, i, fn){
  const [d,p] = id.split("-");
  const s = slot(d,p), itens = clone(s.itens);
  fn(itens[i]);
  await gravarSlot(id, itens, s.nota);
}

  const [k,lab] = tipo(it);
  const st = it.st || "";

    const r = restTexto(it);
    nome = esc(it.t) + ": " + (r.esc ? `<span class="rest-esc">${esc(r.esc)}</span>` : `<span class="rest-opc">${esc(r.opc)}</span>`);
    if (S.owner && opts.edit && st!=="cancelado"){
      extra = `<div class="chips">${it.rest.map(n=>`<button type="button" class="chip" data-act="esc" data-slot="${sid}" data-i="${i}" data-v="${n}" aria-pressed="${it.esc==n && !it.outro}">${esc(REST[n].nome)}</button>`).join("")}</div>`;
    }
  }
  const chk = (S.owner && opts.edit) ? `<button type="button" class="check" data-act="feito" data-slot="${sid}" data-i="${i}" aria-pressed="${st==="feito"}" aria-label="Marcar como feito">✓</button>` : `<span></span>`;

}

function calcGastos(){
  const r = {trio:0, avos:0, total:0, cat:{}};
  ORC.cats.forEach(c => r.cat[c.id] = 0);
  for (const g of S.gastos){
    const v = g.valor || 0, t = g.rateio==="trio" ? v : g.rateio==="avos" ? 0 : v*3/5;
    r.total += v; r.trio += t; r.avos += v - t;
    if (r.cat[g.cat] != null) r.cat[g.cat] += t;
  }
  return r;
}
function barra(v, teto, prev){
  const w = Math.min(100, teto ? v/teto*100 : 0), pm = prev && teto ? Math.min(100, prev/teto*100) : null;
  return `<div class="barra"><i class="${prev && v>prev?"alto":""}" style="width:${w.toFixed(1)}%"></i>${pm!=null?`<s style="left:${pm.toFixed(1)}%"></s>`:""}</div>`;
}

  </div>`;
  const cats = `<div class="card bloco"><h3>Trio por categoria</h3>${ORC.cats.map(k=>`<div class="cat"><div class="lin"><b>${k.nome}</b><span class="num">${brl(c.cat[k.id])} <span class="sec">de ${brl(k.teto)}${k.prev?`, previsto ${brl(k.prev)}`:""}</span></span></div>${barra(c.cat[k.id], k.teto, k.prev)}</div>`).join("")}<p class="sec" style="font-size:.82rem">A marca vertical indica o previsto no Quadro B.11; a barra fica laranja quando o gasto passa do previsto. Voos, hotel e transfer já foram pagos e não entram aqui.</p></div>`;
  const hojeTrip = n.data >= DIAS[0].data && n.data <= DIAS[7].data ? n.data : DIAS[0].data;
  const form = S.owner ? `<form class="card gasto" id="f-gasto">
    <h3 class="full">Lançar gasto</h3>
    <label class="campo">Data<input class="inp" type="date" id="g-data" min="2026-10-01" max="2026-11-30" value="${hojeTrip}" required></label>
    <label class="campo">Valor (R$)<input class="inp num" id="g-valor" inputmode="decimal" placeholder="0,00" required></label>
    <label class="campo full">Descrição<input class="inp" id="g-desc" placeholder="Ex.: jantar na Pastasciutta" maxlength="120" required></label>
    <label class="campo">Categoria<select class="inp" id="g-cat">${ORC.cats.map(k=>`<option value="${k.id}">${k.nome}</option>`).join("")}</select></label>
    <label class="campo">Quem paga<select class="inp" id="g-rat">${Object.entries(RATEIO).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>
    <div class="full acoes"><button class="btn pri" type="submit">Lançar</button></div>
  </form>` : "";
  const ord = [...S.gastos].sort((a,b)=> (b.data||"").localeCompare(a.data||"") || (b.em||"").localeCompare(a.em||""));
  const lista = ord.length ? `<div class="card"><h3>Lançamentos <span class="sec num" style="font-family:var(--f-txt);font-size:.9rem">${brl(c.total)} no total</span></h3><div style="margin-top:8px">${ord.map(g=>{
    const conf = S.confirmar === "g-"+g.id;
    return `<div class="lanc"><span>${esc(g.desc)}</span><span class="val">${brl(g.valor)}</span><span class="meta">${dataBR(g.data)} · ${esc((ORC.cats.find(k=>k.id===g.cat)||{}).nome||"")} · ${esc(RATEIO[g.rateio]||"")}</span>${S.owner?`<span style="text-align:right"><button type="button" class="btn peq ${conf?"alerta":""}" data-act="delgasto" data-id="${esc(g.id)}">${conf?"Confirmar exclusão":"Excluir"}</button></span>`:"<span></span>"}</div>`;
  }).join("")}</div></div>` : `<div class="card"><h3>Nenhum gasto lançado</h3><p class="sec" style="margin-top:6px">${S.owner?"Use o formulário acima para lançar a primeira despesa. A divisão padrão segue o roteiro: 3/5 para o trio e 2/5 para os avós.":"Os gastos lançados pelo organizador aparecem aqui, com a comparação contra o orçamento."}</p></div>`;
  return `<div class="bloco">${resumo}${cats}${form}${lista}</div>`;
}

/* ===================== DIÁLOGO DE EDIÇÃO ===================== */
let ED = null;
function abrirEditor(sid){
  const [d,p] = sid.split("-");
  const s = slot(d,p), dia = DIAS.find(x=>x.id===d);
  ED = {sid, itens: clone(s.itens), nota: s.nota, titulo:`${dia.sem}, ${ddmm(dia.data)} · ${PER[p]}`};
  desenharEditor();
  $("#dlg").showModal();
}
function lerEditor(){
  ED.itens.forEach((it,i)=>{
    it.h = ($("#ed-h-"+i)?.value || "").trim();
    it.t = ($("#ed-t-"+i)?.value || "").trim();
    const st = $("#ed-s-"+i)?.value || ""; if (st) it.st = st; else delete it.st;
    if (it.rest){ const r = $("#ed-r-"+i)?.value || ""; const o = ($("#ed-o-"+i)?.value||"").trim();
      delete it.esc; delete it.outro;
      if (r==="outro" && o) it.outro = o; else if (r && r!=="outro") it.esc = +r; }
  });
  ED.nota = ($("#ed-nota")?.value || "").trim();
}
function desenharEditor(){
  const rows = ED.itens.map((it,i)=>`<div class="ed-item">
    <label class="campo">Hora<input class="inp num" id="ed-h-${i}" value="${esc(it.h||"")}" placeholder="20h00"></label>
    <label class="campo">Atividade<input class="inp" id="ed-t-${i}" value="${esc(it.t)}"></label>
    ${it.rest?`<label class="campo full">Restaurante<select class="inp" id="ed-r-${i}"><option value="">A definir (mostrar opções)</option>${it.rest.map(n=>`<option value="${n}" ${it.esc==n&&!it.outro?"selected":""}>${esc(REST[n].nome)}</option>`).join("")}<option value="outro" ${it.outro?"selected":""}>Outro</option></select></label>
    <label class="campo full">Outro restaurante<input class="inp" id="ed-o-${i}" value="${esc(it.outro||"")}" placeholder="Nome, se escolheu outro"></label>`:""}
    <label class="campo">Situação<select class="inp" id="ed-s-${i}"><option value="">Previsto</option><option value="feito" ${it.st==="feito"?"selected":""}>Feito</option><option value="cancelado" ${it.st==="cancelado"?"selected":""}>Cancelado</option></select></label>
    <div style="display:flex;align-items:flex-end;justify-content:flex-end"><button type="button" class="btn peq alerta" data-act="ed-rem" data-i="${i}">Remover</button></div>
  </div>`).join("");
  $("#dlg-in").innerHTML = `<h3>${esc(ED.titulo)}</h3>
    <p class="sec" style="font-size:.88rem">Hora no formato 20h00. Os itens são ordenados pela hora ao salvar.</p>
    ${rows}
    <div><button type="button" class="btn" data-act="ed-add">Incluir atividade</button></div>
    <label class="campo">Nota para o grupo<textarea class="inp" id="ed-nota" rows="2" placeholder="Ex.: encontro no saguão às 8h45">${esc(ED.nota)}</textarea></label>
    <div class="acoes" style="justify-content:flex-end"><button type="button" class="btn" data-act="ed-cancel">Cancelar</button><button type="button" class="btn pri" data-act="ed-save">Salvar</button></div>`;
}

/* ===================== EVENTOS ===================== */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a!=="desfazer" && a!=="delgasto") S.confirmar = null;
  if (a==="tab"){ S.tab = b.dataset.v; render(); window.scrollTo(0,0); return; }
  if (a==="dia"){ S.dia = b.dataset.v; render(); return; }
  if (a==="lug"){ S.lug = b.dataset.v; render(); return; }
  if (a==="lugf"){ S.lugFiltro = b.dataset.v; render(); return; }
  if (a==="sim"){
    const d = $("#sim-dia").value, t = /^(\d{2}):(\d{2})/.exec($("#sim-hora").value || "");
    if (!t){ toast("Informe a hora."); return; }
    S.sim = {data:d, min:(+t[1])*60 + (+t[2])}; S.dia = DIAS.find(x=>x.data===d)?.id || S.dia; render(); return;
  }
  if (a==="sim-off"){ S.sim = null; S.dia = null; render(); return; }
  if (!S.owner || !S.db) { if (!a.startsWith("ed-")) { toast("Só o organizador altera a programação."); return; } }
  if (a==="feito") return alterarItem(b.dataset.slot, +b.dataset.i, it => { if (it.st==="feito") delete it.st; else it.st = "feito"; });
  if (a==="esc") return alterarItem(b.dataset.slot, +b.dataset.i, it => { delete it.outro; it.esc = (it.esc == b.dataset.v) ? undefined : +b.dataset.v; if (!it.esc) delete it.esc; });
  if (a==="editar") return abrirEditor(b.dataset.slot);
  if (a==="desfazer"){
    const k = "desf-"+b.dataset.slot;
    if (S.confirmar !== k){ S.confirmar = k; render(); return; }
    S.confirmar = null;
    try { await S.db.doc("ajustes/"+b.dataset.slot).delete(); toast("Período voltou ao roteiro original"); } catch(err){ toast("Não foi possível desfazer: "+(err?.message||"erro")); }
    return;
  }
  if (a==="chuva"){
    const on = !S.dias[b.dataset.dia]?.chuva;
    try { await S.db.doc("dias/"+b.dataset.dia).set({chuva:on, em:new Date().toISOString()}); toast(on?"Plano de chuva aplicado":"Plano normal restaurado"); } catch(err){ toast("Não foi possível salvar: "+(err?.message||"erro")); }
    return;
  }
  if (a==="delgasto"){
    const k = "g-"+b.dataset.id;
    if (S.confirmar !== k){ S.confirmar = k; render(); return; }
    S.confirmar = null;
    try { await S.db.doc("gastos/"+b.dataset.id).delete(); toast("Gasto excluído"); } catch(err){ toast("Não foi possível excluir: "+(err?.message||"erro")); }
    return;
  }
  if (a==="ed-add"){ lerEditor(); ED.itens.push({h:"",t:""}); desenharEditor(); return; }
  if (a==="ed-rem"){ lerEditor(); ED.itens.splice(+b.dataset.i,1); desenharEditor(); return; }
  if (a==="ed-cancel"){ $("#dlg").close(); ED = null; return; }
  if (a==="ed-save"){
    lerEditor();
    const itens = ED.itens.filter(it => it.t);
    if (ED.itens.some(it => it.h && minDe(it.h)==null)){ toast("Use a hora no formato 20h00."); return; }
    const sid = ED.sid, nota = ED.nota;
    $("#dlg").close(); ED = null;
    await gravarSlot(sid, itens, nota);
  }
});

document.addEventListener("submit", async e => {
  if (e.target.id !== "f-gasto") return;
  e.preventDefault();
  if (!S.owner || !S.db) return;
  const valor = parseValor($("#g-valor").value);
  const desc = $("#g-desc").value.trim();
  if (!(valor > 0)){ toast("Informe o valor, por exemplo 125,50."); return; }
  if (!desc){ toast("Informe a descrição."); return; }
  const g = {data:$("#g-data").value, valor, desc, cat:$("#g-cat").value, rateio:$("#g-rat").value, em:new Date().toISOString()};
  try { await S.db.collection("gastos").add(g); $("#g-valor").value=""; $("#g-desc").value=""; toast("Gasto lançado: "+brl(valor)); }
  catch(err){ toast("Não foi possível lançar: "+(err?.code==="quota_exceeded" ? "limite de registros atingido" : err?.message||"erro")); }
});

window.addEventListener("hashchange", render);
setInterval(()=>{ if (S.tab==="hoje" && !$("#dlg").open && !document.querySelector("#view details[open]")) render(); }, 60000);

/* ===================== INICIALIZAÇÃO ===================== */
render();
(async () => {
  if (ESTATICO){ S.aj = ESTATICO.aj || {}; S.dias = ESTATICO.dias || {}; S.gastos = ESTATICO.gastos || []; S.dbStatus = "estatico"; render(); return; }
  if (!window.claude?.use){ S.dbStatus = "off"; render(); return; }
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  S.owner = user ? await user.isOwner() : false;
  if (!db){ S.dbStatus = "off"; S.owner = false; render(); return; }
  S.db = db; S.dbStatus = "on";
  const falha = err => { if (err?.code!=="unavailable") { S.dbStatus = "off"; S.owner = false; render(); } };
  db.collection("ajustes").onSnapshot(snap => { const m = {}; snap.docs.forEach(d => m[d.id] = d.data()); S.aj = m; if (!$("#dlg").open) render(); }, falha);
  db.collection("dias").onSnapshot(snap => { const m = {}; snap.docs.forEach(d => m[d.id] = d.data()); S.dias = m; if (!$("#dlg").open) render(); }, falha);
  db.collection("gastos").onSnapshot(snap => { S.gastos = snap.docs.map(d => ({id:d.id, ...d.data()})); if (!$("#dlg").open) render(); }, falha);
  render();
})();
</script>
